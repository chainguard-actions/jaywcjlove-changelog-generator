name: Test basic push scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          original-markdown: 'true'
          show-emoji: 'true'
          order: 'asc'
          base-ref: 'v1.0.0'
          head-ref: '1.0.0'

      - name: Assert branch output is set
        env:
          BRANCH: ${{ steps.action.outputs.branch }}
        run: |
          echo "branch: $BRANCH"
          if [ -z "$BRANCH" ]; then
            echo "FAIL: branch output is empty"
            exit 1
          fi
          echo "PASS: branch=$BRANCH"

      - name: Assert tag output is set
        env:
          TAG: ${{ steps.action.outputs.tag }}
        run: |
          echo "tag: $TAG"
          if [ -z "$TAG" ]; then
            echo "FAIL: tag output is empty"
            exit 1
          fi
          echo "PASS: tag=$TAG"

      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
