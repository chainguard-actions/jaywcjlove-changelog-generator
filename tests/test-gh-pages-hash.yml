name: Test gh-pages hash output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get HEAD SHA
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Current SHA: $SHA"

      - id: changelog
        uses: .
        with:
          token: ${{ github.token }}
          head-ref: ${{ steps.sha.outputs.sha }}
          base-ref: ${{ steps.sha.outputs.sha }}
          gh-pages: 'gh-pages'
          show-emoji: 'true'
          original-markdown: 'true'

      - name: Assert branch output is set
        env:
          BRANCH: ${{ steps.changelog.outputs.branch }}
        run: |
          echo "branch: $BRANCH"
          if [ -z "$BRANCH" ]; then
            echo "FAIL: branch output is empty"
            exit 1
          fi
          echo "PASS: branch output is set to '$BRANCH'"

      - name: Check gh-pages-hash output (may be empty if branch does not exist)
        env:
          GH_PAGES_HASH: ${{ steps.changelog.outputs.gh-pages-hash }}
          GH_PAGES_SHORT_HASH: ${{ steps.changelog.outputs.gh-pages-short-hash }}
        run: |
          echo "gh-pages-hash: $GH_PAGES_HASH"
          echo "gh-pages-short-hash: $GH_PAGES_SHORT_HASH"
          # If gh-pages branch exists, both hash outputs should be set
          if [ -n "$GH_PAGES_HASH" ]; then
            if [ -z "$GH_PAGES_SHORT_HASH" ]; then
              echo "FAIL: gh-pages-hash is set but gh-pages-short-hash is empty"
              exit 1
            fi
            # Short hash should be 7 characters
            if [ ${#GH_PAGES_SHORT_HASH} -ne 7 ]; then
              echo "FAIL: gh-pages-short-hash should be 7 characters, got: ${#GH_PAGES_SHORT_HASH}"
              exit 1
            fi
            echo "PASS: gh-pages-hash=$GH_PAGES_HASH, gh-pages-short-hash=$GH_PAGES_SHORT_HASH"
          else
            echo "PASS: gh-pages branch not found (outputs are empty as expected)"
          fi
