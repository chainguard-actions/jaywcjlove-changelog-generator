name: Test basic changelog generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          order: asc
          original-markdown: 'true'
          show-emoji: 'true'
          filter: ''
          filter-author: ''
          remove-type: 'false'
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          echo "changelog: ${{ steps.action.outputs.changelog }}"
          echo "tag: ${{ steps.action.outputs.tag }}"
          echo "branch: ${{ steps.action.outputs.branch }}"
          # The action may succeed or fail depending on git history,
          # but it should at least attempt to run (not a setup error)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=${{ steps.action.outcome }})"
