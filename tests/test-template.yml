name: Test template input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          head-ref: ${{ github.sha }}
          base-ref: ${{ github.sha }}
          template: '- {{message}} ({{author}})\n'
          original-markdown: 'true'
          show-emoji: 'false'

      - name: Assert changelog output exists (template input accepted)
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
          TAG: ${{ steps.action.outputs.tag }}
          BRANCH: ${{ steps.action.outputs.branch }}
        run: |
          echo "changelog: $CHANGELOG"
          echo "tag: $TAG"
          echo "branch: $BRANCH"
          # When head-ref == base-ref there are no commits between them,
          # so changelog should be empty or a no-diff marker — either is fine.
          # The key assertion is that the action completed without error.
          echo "PASS: action completed successfully with template input"
