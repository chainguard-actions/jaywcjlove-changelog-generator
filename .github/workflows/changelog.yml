name: test
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build
      - run: npm run coverage

      # - run: mkdir -p build
      # - run: npm i markdown-to-html-cli -g
      # - run: markdown-to-html --output build/index.html --github-corners https://github.com/jaywcjlove/changelog-generator

      - name: Create idoc config
        run: |
          cat > idoc.yml << EOF
          site: "Create Tag {{version}}"
          output: wwww
          menus:
            Home: index.html
            Sponsor: https://jaywcjlove.github.io/#/sponsor
          footer: |
            <a href="https://jaywcjlove.github.io/#/sponsor" target="_blank">Sponsor</a> • 
            <a href="https://jaywcjlove.github.io/create-tag-action" target="_blank">Create Tag</a> • 
            <a href="https://jaywcjlove.github.io/github-action-contributors" target="_blank">Contributors</a> • 
            <a href="https://jaywcjlove.github.io/github-action-read-file" target="_blank">Read File Content</a> • 
            <a href="https://jaywcjlove.github.io/generated-badges" target="_blank">Generated Badges</a>
            <br />
            Released under the MIT License. Copyright © {{idocYear}} Kenny Wong<br />
            Generated by <a href="https://github.com/jaywcjlove/idoc" target="_blank">idoc</a> v{{idocVersion}}
          
          EOF
  
      - run: npm install idoc@1 -g
      - run: idoc
  
      - name: Generate Contributors Images
        uses: jaywcjlove/github-action-contributors@86707f6d4c2469ce6b46bc3367253ebd41ee242c # main
        with:
          filter-author: (renovate\[bot\]|renovate-bot|dependabot\[bot\])
          output: wwww/CONTRIBUTORS.svg
          avatarSize: 42
          
      - run: cp -rp coverage/lcov-report wwww
      - name: Create Coverage Badges
        uses: jaywcjlove/coverage-badges-cli@21e7e3fc581e3a577324bbfd4abfa5e3cb375db7 # main
        with:
          source: coverage/coverage-summary.json
          output: wwww/badges.svg

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./wwww

      - name: Create Tag
        id: create_tag
        uses: jaywcjlove/create-tag-action@a9b54d7b5e0cd0670eccefc0afd56688adae1522 # main
        with:
          package-path: ./package.json

      - name: Generate Changelog
        id: changelog
        # uses: jaywcjlove/changelog-generator@main
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          head-ref: ${{steps.create_tag.outputs.version}}
          original-markdown: true
          filter: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'

      - name: Print changelog outputs
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          TAG: ${{ steps.changelog.outputs.tag }}
          BRANCH: ${{ steps.changelog.outputs.branch }}
          COMPAREURL: ${{ steps.changelog.outputs.compareurl }}
          VERSION: ${{ steps.changelog.outputs.version }}
          GH_PAGES_HASH: ${{ steps.changelog.outputs.gh-pages-hash }}
          GH_PAGES_SHORT_HASH: ${{ steps.changelog.outputs.gh-pages-short-hash }}
        run: |
          echo "outputs.changelog - $CHANGELOG"
          echo "outputs.tag - $TAG"
          echo "outputs.branch - $BRANCH"
          echo "outputs.compareurl - $COMPAREURL"
          echo "outputs.version - $VERSION"
          echo "outputs.gh-pages-hash - $GH_PAGES_HASH"
          echo "outputs.gh-pages-hash - $GH_PAGES_HASH"
          echo "outputs.gh-pages-short-hash - $GH_PAGES_SHORT_HASH"

      - name: Generate Changelog (path test)
        id: changelog_path
        # uses: jaywcjlove/changelog-generator@main
        uses: ./
        with:
          path: ./.github/workflows/changelog.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          head-ref: ${{steps.create_tag.outputs.version}}
          original-markdown: true
          filter: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'

      - name: Generate Changelog (show-emoji test)
        # uses: jaywcjlove/changelog-generator@main
        id: changelogEmoji
        uses: ./
        with:
          filter: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'
          show-emoji: false
          remove-type: true

      - name: Order Changelog (ASC)
        uses: ./
        with:
          filter: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'
          show-emoji: false
          remove-type: true
          order: 'asc'

      - name: Order Changelog (DESC)
        uses: ./
        with:
          filter: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'
          show-emoji: false
          remove-type: true
          order: 'desc'
      
      - name: Generate Changelog (outputs.changelog)
        env:
          CHANGELOG_EMOJI: ${{ steps.changelogEmoji.outputs.changelog }}
        run: echo "$CHANGELOG_EMOJI"

      - name: Generate Changelog(main)
        uses: jaywcjlove/changelog-generator@1009fc1683464607a9b4329d95742507f3207055 # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          head-ref: ${{steps.create_tag.outputs.version}}
          filter-author: (小弟调调™|Renovate Bot)
          filter: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'

      - name: Generate Changelog(custom-emoji test)
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          head-ref: ${{steps.create_tag.outputs.version}}
          filter-author: (小弟调调™|Renovate Bot)
          filter: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'
          custom-emoji: 'type🐝,feat💄,fix🆎'

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        if: steps.create_tag.outputs.successful
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.create_tag.outputs.version }}
          tag: ${{ steps.create_tag.outputs.version }}
          body: |
            ```yml
            - name: Generate changelog
              id: changelog
              uses: jaywcjlove/changelog-generator@${{ steps.create_tag.outputs.version }}
              with:
                token: # Your GITHUB_TOKEN
                filter-author: (jaywcjlove|小弟调调™|dependabot\[bot\]|Renovate Bot)
                filter: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'
            ```
            
            ${{ steps.changelog.outputs.compareurl }}
            
            ${{ steps.changelog.outputs.changelog }}
            
            Document Website: https://raw.githack.com/jaywcjlove/changelog-generator/${{ steps.changelog.outputs.gh-pages-short-hash }}/index.html
